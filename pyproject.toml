[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-tabpfn"
version = "0.1.0"
description = "Cheap Reliability: Rethinking Conformal Prediction for Tabular Foundation Models on Small Data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "optional: cross-checks against third-party libraries; skipped when absent",
    "slow: long-running Monte-Carlo gates",
    "gpu: requires a working CUDA device",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E741",    # ambiguous variable names (l, I) are fine in maths code
    "B905",    # zip(strict=) not required on 3.10
    "RUF005",
    "SIM108",  # ternaries are not always clearer than if/else here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
