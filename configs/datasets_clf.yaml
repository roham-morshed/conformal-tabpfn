# Classification datasets (OpenML).
#
# `openml_id` is the primary identifier.  `fallback_name` is used only if that id
# fails to resolve, in which case download_assets.py records the substitution in
# the `resolved` block it writes back into this file.
#
# Expected shapes are from the project spec and are CHECKED at download time; a
# mismatch is reported, never silently accepted.

datasets:
